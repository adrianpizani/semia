version: '3.8'

services:
  # --- Servicio 1: La Base de Datos (PostGIS) ---
  db:
    image: postgis/postgis:16-3.4
    container_name: pba_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pba_dashboard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # Opcional: para que otros servicios esperen a que esté lista
      test: ["CMD-SHELL", "pg_isready -U root -d pba_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Servicio 2: El Backend (FastAPI) ---
  backend:
    build: ./backend
    container_name: pba_backend
    ports:
      - "8000:8000" 
    volumes:
      - ./backend/app:/app
      # El bind de ./backend/app oculta lo que el Dockerfile copia fuera de app/.
      - ./backend/static:/app/static
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/migrations:/app/migrations 
    depends_on:
      db: 
        condition: service_healthy

  # --- Servicio 4: Ejemplo de Microservicio (Cache) ---
  redis:
    image: redis:7-alpine
    container_name: pba_cache
    ports:
      - "6380:6379"

  # --- Servicio 5: El Frontend (Next.js) ---
  frontend:
    build: ./frontend
    container_name: pba_frontend
    ports:
      - "3000:3000"
    environment:
      # Dentro de la red de Docker "localhost" no llega al backend,
      # por eso apuntamos al nombre del servicio.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita que el node_modules del host pise el del contenedor
    depends_on:
      - backend

  # --- Servicio 6: Reverse Proxy de entrada (Nginx) ---
  # Enruta /api/* al backend (sin pasar por el proxy de Next, para uploads grandes)
  # y / al frontend. Es la entrada recomendada también para el deploy en cloud.
  nginx:
    image: nginx:alpine
    container_name: pba_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: