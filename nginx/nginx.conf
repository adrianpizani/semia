# Reverse proxy de entrada para Semia.
# Enruta /api/* DIRECTAMENTE al backend para evitar el buffer y el límite de body
# del proxy de Next.js (10MB por defecto) en uploads grandes (p. ej. la elección ~95MB).
# Mantiene la conexión con el frontend (websockets para el HMR de Next dev).

client_max_body_size 300m;

server {
    listen 80;
    server_name _;

    # API -> Backend (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Necesario para el HMR de Next dev
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}