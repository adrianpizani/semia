# semia.conf — server blocks para producción.
# Reverse proxy:
#   80  → 443 (redirect)
#   443 → /
#     /api/*  → backend:8000
#     /       → frontend:3000
#
# Uploads grandes: client_max_body_size 300m (alineado con dev).

# ───────── 80 → 443 ─────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge de Let's Encrypt: responde en 80 sin redirigir.
    # Si en el futuro se automatiza certbot dentro del container, esta location
    # ya está lista (de lo contrario se puede dejar inactiva).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───────── 443 (HTTPS) ─────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name semia.studio www.semia.studio;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Uploads grandes (95 MB CSV electoral).
    client_max_body_size 300m;

    # Headers de seguridad.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS: activar solo después de confirmar que TLS funciona bien.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── API → Backend ───
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # CSVs grandes tardan; subir el timeout del read.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Frontend (Next.js) ───
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
