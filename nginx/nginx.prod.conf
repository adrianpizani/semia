# nginx.prod.conf — entrypoint para producción (HTTPS).
# El server block vive en conf.d/walicho.conf para mantener limpio el entrypoint.
# Certificados gestionados por certbot en el host (ver DEPLOY.md §2.6) y
# montados en ./nginx/certs/.
#
# Decisión: 80 redirige a 443 (HSTS-ready). Si el cert no está emitido aún,
# ver DEPLOY.md §2.6 paso 2 — se levanta nginx solo en 80 temporalmente
# para hacer el http-01 challenge.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip para respuestas grandes (GeoJSON del mapa).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    # Server blocks de la app.
    include /etc/nginx/conf.d/*.conf;
}
