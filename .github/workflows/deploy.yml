# Deploy a producción: build → ECR → pull/up en EC2 vía SSM.
# Requiere:
#   - Repos ECR semia-backend / semia-frontend
#   - OIDC IdP + role IAM (ver DEPLOY.md §9.4)
#   - Secrets/vars de GitHub (ver abajo)
#   - EC2 Online en SSM con rol semia-ec2

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC → AWS
  contents: read

env:
  AWS_REGION: sa-east-1

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    # Solo main (o disparo manual).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          echo "registry=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/semia-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/semia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          tags: |
            ${{ steps.meta.outputs.registry }}/semia-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/semia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          ECR_REGISTRY: ${{ steps.meta.outputs.registry }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "semia deploy ${IMAGE_TAG}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /home/ubuntu/semia",
              "export ECR_REGISTRY='"${ECR_REGISTRY}"'",
              "export IMAGE_TAG='"${IMAGE_TAG}"'",
              "grep -q '^ECR_REGISTRY=' .env && sed -i \"s|^ECR_REGISTRY=.*|ECR_REGISTRY=${ECR_REGISTRY}|\" .env || echo \"ECR_REGISTRY=${ECR_REGISTRY}\" >> .env",
              "grep -q '^IMAGE_TAG=' .env && sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|\" .env || echo \"IMAGE_TAG=${IMAGE_TAG}\" >> .env",
              "aws ecr get-login-password --region sa-east-1 | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose -f docker-compose.prod.yml --env-file .env pull backend frontend",
              "docker compose -f docker-compose.prod.yml --env-file .env up -d backend frontend nginx",
              "docker image prune -f"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId=$COMMAND_ID"
          # Esperar resultado (hasta ~10 min)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "attempt $i status=$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timeout waiting for SSM"
          exit 1
