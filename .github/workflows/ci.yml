# CI en pull requests y pushes a main.
# No despliega: solo valida que frontend buildea y el backend importa limpio.
# Deploy automático (ECR + SSM) viene en un workflow aparte.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          # Vacío = mismo origen (igual que prod / Dockerfile).
          NEXT_PUBLIC_API_BASE_URL: ""
          # Evita fallos si algún módulo lee AUTH_SECRET en build.
          AUTH_SECRET: ci-placeholder-secret
        run: npm run build

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (GeoAlchemy / shapely)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev libpq-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app migrations

      - name: Import sanity (app package)
        working-directory: backend/app
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
          SECRET_KEY: ci-placeholder-secret
        # Importa módulos sin levantar el server ni tocar la DB.
        run: |
          python -c "import main, models, schemas, security; print('ok', main.app.title)"
