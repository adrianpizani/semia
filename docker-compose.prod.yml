# docker-compose.prod.yml — para deploy en cloud (EC2).
# Diferencias con docker-compose.yml (dev):
#   - Sin bind-mounts de código (el código va embebido en la imagen).
#   - Sin container_name fijos (escalable sin colisiones).
#   - Secrets externalizados (lee de .env; nunca commiteado).
#   - COOKIE_SECURE=true forzado.
#   - restart: always + healthchecks.
#   - Nginx expone 80/443 al host; frontend/backend quedan en red interna.
#   - Volumen postgres_data con nombre (sobrevive a `docker compose down`).
#
# Levantar:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# (--env-file es opcional si exportás las vars en el shell antes).
#
# Pre-requisito: tener un .env completo en la raíz (ver .env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - semia

  backend:
    build: ./backend
    # Sin bind-mounts: código, alembic, GeoJSON de seed (backend/static/)
    # y el entrypoint van embebidos en la imagen. Al arrancar, el entrypoint
    # corre `alembic upgrade head` y después uvicorn. El seed
    # (import_geojson / import_circuitos) lee /app/static/*.geojson.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      # Forzado a true en prod (HTTPS detrás de nginx).
      COOKIE_SECURE: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 2 workers caben en t3.micro junto a PostGIS + Next. Subir a 4 solo con más RAM.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: always
    networks:
      - semia

  frontend:
    build:
      context: ./frontend
      args:
        # Vacío en prod: las llamadas a /api/* van vía rewrites de Next al mismo
        # origen (nginx). Si esto se rompe el login no funciona por cookies cross-origin.
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      # BACKEND_URL se usa en next.config.mjs para construir las rewrites.
      # Dentro de la red Docker, 'backend' resuelve al servicio backend.
      BACKEND_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - backend
    expose:
      - "3000"
    restart: always
    networks:
      - semia

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
# Certificados TLS (gestionados por certbot en el host, ver DEPLOY.md).
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - semia

volumes:
  postgres_data:

networks:
  semia:
    driver: bridge
